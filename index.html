<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢甲大學美食推薦系統 (FengChia Eats)</title>
    <meta name="description" content="專屬逢甲人的美食地圖與評價系統">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons (for modern UI icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="ph ph-fork-knife"></i>
                <h1>FCU Eats</h1>
            </div>
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="搜尋逢甲美食...">
            </div>
            <button id="themeToggle" class="icon-btn" aria-label="切換深淺色模式">
                <i class="ph ph-moon"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main id="mainContent">
            <!-- Home View (Categories & List) -->
            <div id="homeView" class="view active">
                <!-- Location Control Panel -->
                <section class="location-panel">
                    <div class="location-container">
                        <div class="location-info">
                            <div class="location-icon-wrapper">
                                <i class="ph ph-map-pin"></i>
                            </div>
                            <div class="location-details">
                                <span class="location-label">目前定位中心</span>
                                <span id="currentLocationName" class="location-name">逢甲大學正門 (模擬)</span>
                            </div>
                        </div>
                        <div class="location-actions">
                            <button id="getLocationBtn" class="location-btn">
                                <i class="ph ph-gps"></i> 使用 GPS 定位
                            </button>
                            <div class="select-wrapper">
                                <select id="mockLocationSelect" class="location-select">
                                    <option value="fcu-gate" selected>📍 模擬：逢甲大學正門</option>
                                    <option value="fcu-ie">📍 模擬：逢甲大學資電館</option>
                                    <option value="night-market">📍 模擬：逢甲夜市入口</option>
                                    <option value="mcdonalds">📍 模擬：逢甲麥當勞</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="categories">
                    <h2>分類探索</h2>
                    <div class="category-list" id="categoryList">
                        <!-- Categories injected by JS -->
                    </div>
                </section>
                
                <section class="restaurant-list-section">
                    <div class="section-header-flex">
                        <h2>推薦美食</h2>
                        <div class="sort-tabs" id="sortTabs">
                            <button class="sort-tab active" data-sort="recommended">
                                <i class="ph-fill ph-sparkles"></i> 綜合推薦
                            </button>
                            <button class="sort-tab" data-sort="distance">
                                <i class="ph-fill ph-compass"></i> 距離最近
                            </button>
                        </div>
                    </div>
                    <div class="restaurant-grid" id="restaurantGrid">
                        <!-- Restaurant cards injected by JS -->
                    </div>
                </section>
            </div>

            <!-- Detail View -->
            <div id="detailView" class="view hidden">
                <button id="backBtn" class="back-btn">
                    <i class="ph ph-arrow-left"></i> 返回列表
                </button>
                <div id="detailContent">
                    <!-- Detail injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="mockData.js"></script>
    <script src="app.js"></script>
</body>
</html>
