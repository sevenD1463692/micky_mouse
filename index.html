<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢甲大學美食推薦系統 (FengChia Eats)</title>
    <meta name="description" content="專屬逢甲人的美食地圖與評價系統">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons (for modern UI icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="ph ph-fork-knife"></i>
                <h1>FCU Eats</h1>
            </div>
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="搜尋逢甲美食...">
            </div>
            <button id="themeToggle" class="icon-btn" aria-label="切換深淺色模式">
                <i class="ph ph-moon"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main id="mainContent">
            <!-- Home View (Categories & List) -->
            <div id="homeView" class="view active">
                <section class="categories">
                    <h2>分類探索</h2>
                    <div class="category-list" id="categoryList">
                        <!-- Categories injected by JS -->
                    </div>
                </section>
                
                <!-- Filter & Sort Toolbar -->
                <section class="filter-sort-section">
                    <div class="filter-sort-toolbar">
                        <div class="sort-group">
                            <label for="sortSelect"><i class="ph ph-sort-ascending"></i> 排序方式：</label>
                            <div class="select-wrapper">
                                <select id="sortSelect" class="styled-select">
                                    <option value="default">預設推薦</option>
                                    <option value="rating-desc">評分最高</option>
                                    <option value="reviews-desc">評價最多</option>
                                    <option value="price-asc">價格：由低到高</option>
                                    <option value="price-desc">價格：由高到低</option>
                                </select>
                                <i class="ph ph-caret-down select-caret"></i>
                            </div>
                        </div>
                        <div class="filter-group">
                            <span class="filter-label"><i class="ph ph-funnel"></i> 快速篩選：</span>
                            <div class="filter-chips" id="filterChips">
                                <button class="filter-chip-btn" data-tag="冷氣開放">
                                    <i class="ph ph-snowflake"></i> 冷氣開放
                                </button>
                                <button class="filter-chip-btn" data-tag="有座位">
                                    <i class="ph ph-chair"></i> 有座位
                                </button>
                                <button class="filter-chip-btn" data-tag="平價首選">
                                    <i class="ph ph-coins"></i> 平價首選
                                </button>
                                <button class="filter-chip-btn" data-tag="排隊名店">
                                    <i class="ph ph-users"></i> 排隊名店
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
                
                <section class="restaurant-list-section">
                    <h2>推薦美食</h2>
                    <div class="restaurant-grid" id="restaurantGrid">
                        <!-- Restaurant cards injected by JS -->
                    </div>
                </section>
            </div>

            <!-- Detail View -->
            <div id="detailView" class="view hidden">
                <button id="backBtn" class="back-btn">
                    <i class="ph ph-arrow-left"></i> 返回列表
                </button>
                <div id="detailContent">
                    <!-- Detail injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="mockData.js"></script>
    <script src="app.js"></script>
</body>
</html>
